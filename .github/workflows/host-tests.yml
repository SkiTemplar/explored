# Validación sin Unreal: modelos puros de C++ (con ASan/UBSan) y herramientas Python.
name: host-tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cpp-models:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tests de modelos puros
        run: Tools/HostTests/run.sh
      - name: Tests de modelos puros con ASan/UBSan
        run: HOST_TESTS_SANITIZE=ON Tools/HostTests/run.sh

  # Cada herramienta de Tools/ con su propio pyproject y uv.lock: ruff, basedpyright y
  # pytest con cobertura mínima del 80 % (fail_under en su pyproject).
  python-tools:
    name: python (${{ matrix.tool }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: Packs
            # bpy 5.2 (Blender como módulo) solo existe para Python 3.13.
            python: "3.13"
            groups: --group blender
            egl: true
          - tool: Textures
            python: "3.11"
          - tool: Audio
            python: "3.11"
          - tool: DataCheck
            python: "3.11"
            extra: uv run datacheck --strict
          - tool: Localization
            python: "3.11"
            extra: uv run l10n export --check --quiet
          - tool: Blender
            python: "3.13"
            egl: true
    defaults:
      run:
        working-directory: Tools/${{ matrix.tool }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: Tools/${{ matrix.tool }}/uv.lock
      - name: EGL de Mesa para renderizar con Workbench sin GPU
        if: matrix.egl
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Dependencias
        run: uv sync --locked ${{ matrix.groups }}
      - name: ruff
        run: uv run --no-sync ruff check .
      - name: basedpyright
        run: uv run --no-sync basedpyright
      - name: pytest con cobertura
        run: uv run --no-sync pytest -q --cov --cov-report=term-missing
      - name: Comprobaciones propias de la herramienta
        if: matrix.extra
        run: ${{ matrix.extra }}
