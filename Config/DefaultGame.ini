[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Shipping
bShareMaterialShaderCode=True
bUseIoStore=True
bCompressed=True
; Único mapa del juego (también GameDefaultMap y EditorStartupMap en DefaultEngine.ini).
+MapsToCook=(FilePath="/Game/Maps/Map_IslaSal")
+DirectoriesToAlwaysCook=(Path="/Game/Maps")
; Audio, mallas y materiales que el código carga por ruta (TryLoad, TSoftObjectPtr o rutas de
; Content/Data/*.json): el cocinado no los descubre solo.
; /Game/Art cubre los kits K1-K5, Art/Island, Art/Materials (M_Toon, M_RainStreak, M_BeaconBeam),
; las mallas que lista island_decor.json (IslandDecorModel exige /Game/Art/) y el césped de
; /Game/Art/K6_Cesped con M_ToonCesped (datos en Data/grass.json y Data/ground_field.bin, que entran
; con Data abajo).
+DirectoriesToAlwaysCook=(Path="/Game/Art")
+DirectoriesToAlwaysCook=(Path="/Game/Generated/Audio")
+DirectoriesToAlwaysCook=(Path="/Game/Audio")
+DirectoriesToAlwaysCook=(Path="/Game/Materials")
; Carpetas personales del editor: nunca van al paquete.
+DirectoriesToNeverCook=(Path="/Game/Developers")
; Content/Data/*.json se lee con FFileHelper desde FPaths::ProjectContentDir() (ItemRegistrySubsystem,
; IslandDataLoader, IslandLayoutLoader, IslandPropsLoader, IslandDecorBuilder, GrassConfigLoader, BeaconTexts,
; ExploredMusicSubsystem): se copia suelto junto al .pak.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Data")
; Fuentes (Lora, OFL) y hoja de iconos de la interfaz: Slate las lee del disco (UI/ExploredUIStyle.cpp).
+DirectoriesToAlwaysStageAsUFS=(Path="Slate")
; Avisos y licencias de terceros (EULA de Unreal, CC BY, MIT, OFL): sueltos para que se puedan leer;
; package.ps1 copia además el fichero a la raíz del paquete.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Licenses")
; Localización (docs/tecnico/localizacion.md): español nativo e inglés.
InternationalizationPreset=EFIGS
+CulturesToStage=es
+CulturesToStage=en
