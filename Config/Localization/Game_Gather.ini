; Recopilación de textos del destino de localización «Game» (ES nativo, EN).
; Uso sin el panel: UnrealEditor-Cmd.exe Explored.uproject -run=GatherText -config=Config/Localization/Game_Gather.ini
; Genera Content/Localization/Game/Game.manifest y <cultura>/Game.archive, igual que
; Tools/Localization (uv run l10n export), que es quien mantiene las traducciones al inglés.
; Ver docs/tecnico/localizacion.md. El panel Localization Dashboard reescribe este fichero
; con su propia configuración al pulsar «Gather Text»: mantén ambas iguales.

[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
NativeCulture=es
CulturesToGenerate=es
CulturesToGenerate=en

; Textos del C++ (NSLOCTEXT/LOCTEXT) y de los .ini (p. ej. ProjectDisplayedTitle).
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=%LOCPROJECTROOT%Source/Explored
SearchDirectoryPaths=%LOCPROJECTROOT%Config
ExcludePathFilters=%LOCPROJECTROOT%Source/Explored/Tests/*
ExcludePathFilters=%LOCPROJECTROOT%Config/Localization/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=false

; Textos de los assets (hoy no hay: la UI es Slate en C++ y los datos son JSON).
[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=%LOCPROJECTROOT%Content/*
ExcludePathFilters=%LOCPROJECTROOT%Content/Localization/*
ExcludePathFilters=%LOCPROJECTROOT%Content/Data/*
PackageFileExtensions=*.umap
PackageFileExtensions=*.uasset
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=Game.csv
bConflictReport=true
ConflictReportName=Game_Conflicts.txt
