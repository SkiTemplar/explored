; Compilación del destino «Game»: de <cultura>/Game.archive a <cultura>/Game.locres.
; Uso sin el panel: UnrealEditor-Cmd.exe Explored.uproject -run=GatherText -config=Config/Localization/Game_Compile.ini
; Los .locres son los que carga el juego; se versionan junto a los .archive.
; Ver docs/tecnico/localizacion.md.

[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
ResourceName=Game.locres
bSkipSourceCheck=false
bValidateFormatPatterns=true
bValidateSafeWhitespace=false
NativeCulture=es
CulturesToGenerate=es
CulturesToGenerate=en

[GatherTextStep0]
CommandletClass=GenerateTextLocalizationResource
