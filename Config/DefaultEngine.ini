; TSR reconstruye con buena calidad desde bastante menos de 100%: 87% son un 24% menos de píxeles
; por fotograma (0.87² ≈ 0.76) en todo pase que escale con resolución (Nanite, Lumen, post-proceso,
; traslucencia del agua), con una pérdida de nitidez que el propio TSR disimula razonablemente bien.
; Independiente de sg.ResolutionQuality (Config/DefaultGameUserSettings.ini): es el default del
; motor cuando r.ScreenPercentage<=0 (el caso normal, sin override explícito del jugador).
r.ScreenPercentage.Default=87
; Objetivo de error de pantalla de Nanite en píxeles de borde (por defecto 1.0): con el archipiélago
; entero a la vista desde la cámara aérea (~1800 m de altura), cada malla de terreno lejana sigue
; seleccionando clusters mucho más finos de lo que un píxel puede distinguir a esa distancia. Duplicar
; el objetivo reduce a la mitad el detalle de borde exigido (menos clusters/triángulos procesados)
; en toda malla Nanite, con una pérdida de detalle que solo se nota de cerca si se sube más de esto.
r.Nanite.MaxPixelsPerEdge=2.0

; Presupuesto de VRAM (objetivo: tarjetas de 8 GB, <6,5 GB total en Alto/1080p). 4096 MB para el
; pool de streaming de texturas deja margen para Nanite, Lumen, VSM, niebla/nubes volumétricas y
; los render targets; LimitPoolSizeToVRAM evita que el pool crezca por encima de la VRAM real
; detectada aunque PoolSize pida más.
r.Streaming.PoolSize=4096
r.Streaming.LimitPoolSizeToVRAM=1
