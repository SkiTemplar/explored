; Nivel de escalabilidad de fábrica. Sin esto, UGameUserSettings arranca en Épico (3) —el nivel
; más caro de BaseScalability.ini: Lumen a resolución de sondas máxima, reflejos sin downsample,
; VSM sin bias de resolución, niebla volumétrica a grid de 8 px, TSR.History.ScreenPercentage=200
; (pensado para capturas, no para juego en tiempo real)— para cualquier GPU, sin autodetección
; (RunHardwareBenchmark no corre en el arranque). Alto (2) es el nivel que Epic ya calibra para
; gama media/alta y el que mide Tools/bench.ps1; ver Config/DefaultScalability.ini para los ajustes
; propios de Explored por encima de este nivel. El jugador lo puede subir a mano en Opciones.
[ScalabilityGroups]
sg.ResolutionQuality=0
sg.ViewDistanceQuality=2
sg.AntiAliasingQuality=2
sg.ShadowQuality=2
sg.GlobalIlluminationQuality=2
sg.ReflectionQuality=2
sg.PostProcessQuality=2
sg.TextureQuality=2
sg.EffectsQuality=2
sg.FoliageQuality=2
sg.ShadingQuality=2
sg.LandscapeQuality=2
