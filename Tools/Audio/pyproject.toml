[project]
name = "explored-audio"
version = "0.1.0"
description = "Sintesis procedural de efectos y ambientes de audio para Explored (UE 5.6), sin muestras externas."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
]

[project.scripts]
explored-audio = "explored_audio.cli:main"
explored-music = "explored_audio.recorded.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explored_audio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
