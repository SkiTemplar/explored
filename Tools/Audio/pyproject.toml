[project]
name = "explored-audio"
version = "0.1.0"
description = "Sintesis procedural de efectos y ambientes, y musica adaptativa renderizada con un soundfont acustico libre, para Explored (UE 5.6). Efectos y ambientes siguen sin muestras externas; la musica es la unica excepcion (ver THIRD_PARTY_SOUNDFONT.md)."
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
]

[project.scripts]
explored-audio = "explored_audio.cli:main"
explored-music = "explored_audio.recorded.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "basedpyright>=1.20",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explored_audio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["src", "tests", "scripts"]

[tool.coverage.run]
source = ["src/explored_audio"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
