[project]
name = "explored-style"
version = "0.1.0"
description = "Guía de estilo ejecutable de Baliza Siete (GDD v3 §11): paleta única, validador de mallas y pilotos low poly cartoon generados con Blender 5.2."
# El módulo bpy de PyPI (Blender 5.2) solo existe para Python 3.13.
requires-python = "==3.13.*"
dependencies = ["bpy==5.2.2", "numpy>=2"]

[project.scripts]
check-style = "explored_style.check_style:main"
style-paleta = "explored_style.palette:main"
style-pilotos = "explored_style.pilots:main"
style-lamina = "explored_style.lamina:main"
style-kit-k2 = "explored_style.kits.k2:main"

[build-system]
requires = ["uv_build>=0.8.18,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "explored_style"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "basedpyright>=1.20",
    # stubs de bpy/bmesh/mathutils (solo paquetes *-stubs: conviven con el bpy real)
    "fake-bpy-module-5.2==20260730",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.ruff.lint.isort]
# Con el bpy de PyPI, bmesh y mathutils solo se pueden importar DESPUÉS de bpy.
section-order = ["future", "standard-library", "bpy", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
bpy = ["bpy"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
exclude = [".venv", "**/__pycache__"]
# Mismo criterio que Tools/Blender: con los stubs de fake-bpy-module estas
# reglas son casi todo ruido de los stubs (Object.data es la unión de todos los
# ID, nodes.new() devuelve la clase base Node, casi todo es Optional...).
reportAttributeAccessIssue = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalIterable = "warning"
reportArgumentType = "warning"
reportIndexIssue = "warning"
# bmesh y mathutils son módulos C dentro del bpy de PyPI: solo hay stubs, sin fuente.
reportMissingModuleSource = false

[tool.coverage.run]
source = ["explored_style"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
    "ignore:.(Material|World).use_nodes. is expected to be removed:DeprecationWarning",
]
