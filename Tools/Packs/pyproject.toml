[project]
name = "explored-packs"
version = "0.1.0"
description = "Packs CC0 de terceros (Kenney, KayKit, Quaternius): manifiesto, descarga reproducible con sha256 y normalización en Blender."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "basedpyright>=1.20",
    "pillow>=10.0",
    "fake-bpy-module-5.2==20260730",
]
# Blender 5.2 como módulo de Python (solo 3.13): ejecuta normalize.py en los tests sin el
# editor. Opcional porque pesa 400 MB: `uv run --python 3.13 --group blender pytest`.
blender = [
    "bpy==5.2.2; python_version == '3.13'",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Avisos de NumPy 2.5 dentro del exportador FBX que trae Blender, no de este código.
    "ignore::DeprecationWarning:io_scene_fbx.*",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = [".", "tests"]
exclude = [".venv"]
extraPaths = ["."]

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
