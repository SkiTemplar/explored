[project]
name = "explored-trailer"
version = "0.1.0"
description = "Tráiler de Baliza Siete: mezcla de sonido (música de licencia abierta + ambientes y efectos de Tools/Audio), rótulos ES/EN con la tipografía y la paleta del juego, y montaje final con ffmpeg."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "scipy>=1.11",
    "soundfile>=0.12",
]

[project.scripts]
explored-trailer = "explored_trailer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "basedpyright>=1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explored_trailer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["src", "tests", "assemble.py"]

[tool.coverage.run]
source = ["src/explored_trailer"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
