[project]
name = "explored-localization"
version = "0.1.0"
description = "Catálogo de textos ES/EN de Explored: extrae LOCTEXT/NSLOCTEXT y los campos bilingües de Content/Data, lo valida y exporta el manifiesto y los archivos de Unreal."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
l10n = "l10n.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "basedpyright>=1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/l10n"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["src", "tests"]

[tool.coverage.run]
source = ["src/l10n"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
