[project]
name = "explored-localization"
version = "0.1.0"
description = "Catálogo de textos ES/EN de Explored: extrae LOCTEXT/NSLOCTEXT y los campos bilingües de Content/Data, lo valida y exporta el manifiesto y los archivos de Unreal."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
l10n = "l10n.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/l10n"]

[tool.pytest.ini_options]
testpaths = ["tests"]
