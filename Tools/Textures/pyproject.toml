[project]
name = "explored-textures"
version = "0.1.0"
description = "Texturas por script de Baliza Siete: máscara de trazos estilizados del terreno (T_TerrainStrokes), sin fotos."
requires-python = ">=3.11"
dependencies = ["numpy>=2"]

[project.scripts]
textures-strokes = "explored_textures.strokes:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "basedpyright>=1.20",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "explored_textures"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["explored_textures", "tests"]

[tool.coverage.run]
source = ["explored_textures"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
