[project]
name = "explored-island"
version = "0.1.0"
description = "Terreno de la Isla de Sal (Baliza Siete, GDD v3 §6): malla estática facetada low poly generada desde Content/Data/island.json y coloreada con la hoja de paleta de Tools/Style."
# El módulo bpy de PyPI (Blender 5.2) solo existe para Python 3.13.
requires-python = "==3.13.*"
dependencies = ["bpy==5.2.2", "numpy>=2", "explored-style"]

[project.scripts]
island-terrain = "explored_island.export:main"
island-props-check = "explored_island.props:main"
island-decor = "explored_island.decor:main"

[tool.uv.sources]
# meshkit (MeshBuilder, exportación FBX) y palette (celdas de la hoja) se reutilizan tal cual.
explored-style = { path = "../Style", editable = true }

[build-system]
requires = ["uv_build>=0.8.18,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "explored_island"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "basedpyright>=1.20",
    "fake-bpy-module-5.2==20260730",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.ruff.lint.isort]
# Con el bpy de PyPI, bmesh y mathutils solo se pueden importar DESPUÉS de bpy.
section-order = ["future", "standard-library", "bpy", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
bpy = ["bpy"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
exclude = [".venv", "**/__pycache__"]
reportAttributeAccessIssue = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalIterable = "warning"
reportArgumentType = "warning"
reportIndexIssue = "warning"
reportMissingModuleSource = false

[tool.coverage.run]
source = ["explored_island"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
    "ignore:.(Material|World).use_nodes. is expected to be removed:DeprecationWarning",
]
